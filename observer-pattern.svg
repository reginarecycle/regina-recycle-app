<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="monospace" font-size="12">

  <!-- ISubject Interface -->
  <g>
    <rect x="40" y="80" width="240" height="100" fill="white" stroke="#333" stroke-width="1.5"/>
    <rect x="40" y="80" width="240" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <text x="160" y="91" text-anchor="middle" font-style="italic" font-size="11">&lt;&lt;Interface&gt;&gt;</text>
    <text x="160" y="105" text-anchor="middle" font-weight="bold">ISubject</text>
    <line x1="40" y1="110" x2="280" y2="110" stroke="#333" stroke-width="1"/>
    <text x="55" y="127" font-size="11">register(observer: IObserver): void</text>
    <text x="55" y="143" font-size="11">unregister(observer: IObserver): void</text>
    <text x="55" y="159" font-size="11">notify(event: NotificationEvent): Promise&lt;void&gt;</text>
  </g>

  <!-- IObserver Interface -->
  <g>
    <rect x="720" y="80" width="280" height="80" fill="white" stroke="#333" stroke-width="1.5"/>
    <rect x="720" y="80" width="280" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <text x="860" y="91" text-anchor="middle" font-style="italic" font-size="11">&lt;&lt;Interface&gt;&gt;</text>
    <text x="860" y="105" text-anchor="middle" font-weight="bold">IObserver</text>
    <line x1="720" y1="110" x2="1000" y2="110" stroke="#333" stroke-width="1"/>
    <text x="735" y="127" font-size="11">update(event: NotificationEvent): Promise&lt;void&gt;</text>
    <text x="735" y="148" font-size="11" fill="#666">// NotificationEvent carries type, title,</text>
  </g>

  <!-- Aggregation arrow: ISubject has IObserver[] (1 to *) -->
  <line x1="280" y1="120" x2="720" y2="120" stroke="#333" stroke-width="1.5" stroke-dasharray="none"/>
  <!-- diamond at ISubject end -->
  <polygon points="280,120 294,114 308,120 294,126" fill="white" stroke="#333" stroke-width="1.5"/>
  <!-- arrow at IObserver end -->
  <polygon points="720,120 706,114 706,126" fill="#333"/>
  <text x="330" y="113" font-size="11">1</text>
  <text x="700" y="113" font-size="11">*</text>

  <!-- NotificationGatewayService -->
  <g>
    <rect x="40" y="280" width="340" height="290" fill="white" stroke="#333" stroke-width="1.5"/>
    <rect x="40" y="280" width="340" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <text x="210" y="300" text-anchor="middle" font-weight="bold">NotificationGatewayService</text>
    <line x1="40" y1="310" x2="380" y2="310" stroke="#333" stroke-width="1"/>
    <text x="55" y="327" font-size="11">observers: IObserver[]</text>
    <line x1="40" y1="335" x2="380" y2="335" stroke="#333" stroke-width="1"/>
    <text x="55" y="352" font-size="11">register(observer: IObserver): void</text>
    <text x="55" y="368" font-size="11">unregister(observer: IObserver): void</text>
    <text x="55" y="384" font-size="11">notify(event: NotificationEvent): Promise&lt;void&gt;</text>
    <text x="55" y="400" font-size="11">sendNotification(event: NotificationEvent): Promise&lt;void&gt;</text>
    <text x="55" y="416" font-size="11">notifyPickupScheduled(params): Promise&lt;void&gt;</text>
    <text x="55" y="432" font-size="11">notifyPickupStatusChanged(params): Promise&lt;void&gt;</text>
    <text x="55" y="448" font-size="11">notifyPickupCompleted(params): Promise&lt;void&gt;</text>
    <text x="55" y="464" font-size="11">notifyWalletUpdated(params): Promise&lt;void&gt;</text>
    <text x="55" y="480" font-size="11">notifyNewPickupAvailable(params): Promise&lt;void&gt;</text>
    <text x="55" y="496" font-size="11">notifyPasswordChanged(params): Promise&lt;void&gt;</text>
    <text x="55" y="512" font-size="11">notifyProfileUpdated(params): Promise&lt;void&gt;</text>
    <text x="55" y="528" font-size="11">notifyAlert(params): Promise&lt;void&gt;</text>
  </g>

  <!-- Realization: NotificationGatewayService implements ISubject -->
  <line x1="160" y1="280" x2="160" y2="180" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="160,180 154,194 166,194" fill="white" stroke="#333" stroke-width="1.5"/>

  <!-- EmailNotificationObserver -->
  <g>
    <rect x="590" y="340" width="220" height="80" fill="white" stroke="#333" stroke-width="1.5"/>
    <rect x="590" y="340" width="220" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <text x="700" y="360" text-anchor="middle" font-weight="bold">EmailNotification</text>
    <text x="700" y="374" text-anchor="middle" font-weight="bold">Observer</text>
    <line x1="590" y1="370" x2="810" y2="370" stroke="#333" stroke-width="1"/>
    <line x1="590" y1="378" x2="810" y2="378" stroke="#333" stroke-width="1"/>
    <text x="605" y="395" font-size="11">update(event: NotificationEvent): Promise&lt;void&gt;</text>
    <text x="605" y="411" font-size="11" fill="#888">// Sends email via EmailService</text>
  </g>

  <!-- InAppNotificationObserver -->
  <g>
    <rect x="590" y="500" width="240" height="95" fill="white" stroke="#333" stroke-width="1.5"/>
    <rect x="590" y="500" width="240" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
    <text x="710" y="520" text-anchor="middle" font-weight="bold">InAppNotification</text>
    <text x="710" y="534" text-anchor="middle" font-weight="bold">Observer</text>
    <line x1="590" y1="530" x2="830" y2="530" stroke="#333" stroke-width="1"/>
    <line x1="590" y1="538" x2="830" y2="538" stroke="#333" stroke-width="1"/>
    <text x="605" y="555" font-size="11">update(event: NotificationEvent): Promise&lt;void&gt;</text>
    <text x="605" y="571" font-size="11" fill="#888">// Saves to DB + pushes via Pusher</text>
    <text x="605" y="587" font-size="11" fill="#888">// Uses PrismaService + PusherService</text>
  </g>

  <!-- Realization: EmailNotificationObserver implements IObserver -->
  <line x1="700" y1="340" x2="840" y2="160" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="840,160 828,170 844,176" fill="white" stroke="#333" stroke-width="1.5"/>

  <!-- Realization: InAppNotificationObserver implements IObserver -->
  <line x1="750" y1="500" x2="900" y2="160" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="900,160 888,170 904,176" fill="white" stroke="#333" stroke-width="1.5"/>

  <!-- Association: NotificationGatewayService uses EmailNotificationObserver -->
  <line x1="380" y1="380" x2="590" y2="375" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="590,375 576,369 576,381" fill="#555"/>

  <!-- Association: NotificationGatewayService uses InAppNotificationObserver -->
  <line x1="380" y1="450" x2="590" y2="540" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="590,540 577,529 580,543" fill="#555"/>

  <!-- Legend -->
  <g>
    <rect x="40" y="630" width="500" height="80" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="55" y="648" font-size="11" font-weight="bold">Legend</text>
    <line x1="55" y1="660" x2="100" y2="660" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
    <polygon points="100,660 88,655 88,665" fill="white" stroke="#333" stroke-width="1.5"/>
    <text x="110" y="664" font-size="11">Realization (implements interface)</text>
    <line x1="55" y1="680" x2="100" y2="680" stroke="#333" stroke-width="1.5"/>
    <polygon points="55,680 68,674 68,686" fill="white" stroke="#333" stroke-width="1.5"/>
    <text x="110" y="684" font-size="11">Aggregation (subject holds observers)</text>
    <line x1="260" y1="680" x2="305" y2="680" stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
    <polygon points="305,680 293,674 293,686" fill="#555"/>
    <text x="315" y="684" font-size="11">Uses / registers</text>
  </g>

</svg>
